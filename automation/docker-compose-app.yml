services:
  frontend:
    build: 
      # Use parent context as frontend will need to copy shared folder front backend.
      context: ..
      dockerfile: Dnd-Interactive-Frontend/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
    container_name: dnd-frontend
    restart: unless-stopped
    environment:
      VITE_CLIENT_ID: ${VITE_CLIENT_ID}
    expose:
      - "3000"
  backend:
    build: 
      context: ../Dnd-Interactive-Backend/
      dockerfile: Dockerfile
    container_name: dnd-backend
    restart: unless-stopped
    environment:
      VITE_CLIENT_ID: ${VITE_CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "2567"
  nginx:
    image: nginx:alpine
    container_name: dnd-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-dev
    command: tunnel --url http://nginx:80
    restart: unless-stopped
    depends_on:
      - nginx
