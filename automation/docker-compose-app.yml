services:
  frontend:
    build: 
      # Use parent context as frontend will need to copy shared folder front backend.
      context: ..
      dockerfile: Dnd-Interactive-Frontend/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
    container_name: dnd-frontend
    restart: unless-stopped
    environment:
      VITE_CLIENT_ID: ${VITE_CLIENT_ID}
    expose:
      - "3000"
    networks:
      - dnd-network

  backend:
    build: 
      context: ../Dnd-Interactive-Backend/
      dockerfile: Dockerfile
    container_name: dnd-backend
    restart: unless-stopped
    environment:
      VITE_CLIENT_ID: ${VITE_CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      RUSTFS_REGION: ${RUSTFS_REGION}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "2567"
    networks:
      - dnd-network

  verifier:
    build:
      context: ../Verifier/
      dockerfile: Dockerfile
    container_name: dnd-verifier
    restart: unless-stopped
    environment:
      DISCORD_APPLICATION_ID: ${VITE_CLIENT_ID}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      # openssl rand -hex 32
      COOKIE_SECRET: ${COOKIE_SECRET}
    read_only: true
    networks:
      - dnd-network
      
  nginx:
    image: nginx:alpine
    container_name: dnd-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - verifier
    networks:
      - dnd-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-dev
    command: tunnel --url http://nginx:80
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - dnd-network

networks:
  dnd-network:
    external: true
