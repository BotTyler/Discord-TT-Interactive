events {}

http {
  server {
    listen 80;
    server_name dnd.tylerjarboe.com;

    auth_request /_verify;
    auth_request_set $session_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $session_cookie always;

    location /_verify {
      internal;
      auth_request off;
      proxy_pass http://verifier:3001/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    # Colyseus backend (WebSocket-aware)
    location /colyseus/ {
      proxy_pass http://backend:2567/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100M;
    }

    # Frontend gets everything else
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s3/ {
      limit_except GET HEAD { deny all; }

      proxy_pass http://rustfs:9000/;   # the trailing slash removes /s3/
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
}
