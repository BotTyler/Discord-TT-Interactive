volumes:
  postgres-db:
  pgadmin-data:
  rustfs-data:
services:
  postgres-dev:
    image: postgres
    container_name: postgres-dev
    restart: always
    environment:
        POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
        - postgres-db:/var/lib/postgresql
    ports:
        - "5432:5432"
    networks:
      - dnd-network
  rustfs:
    # Pin a specific GA tag for production instead of :latest
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"                    # S3 API
      - "127.0.0.1:9001:9001"          # console, localhost only
    networks:
      - dnd-network
networks:
  dnd-network:
    external: true
